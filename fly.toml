# Loopclaim.io on Fly.io: one app, a copy in each region below; players reach the nearest one.
app = "loopclaim-io-game"
primary_region = "nrt"

[env]
  # picker id : Fly region code
  REGIONS = "na:iad,sa:gru,eu:fra,asia:nrt,sea:sin,oc:syd,af:jnb"

[http_service]
  internal_port = 8080
  force_https = true
  # idle regions sleep and wake in a second or two when someone connects, so quiet regions cost almost nothing
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
