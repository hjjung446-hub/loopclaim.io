# Deploys to Fly.io on every push to main, once a FLY_API_TOKEN secret is added to the repo (skipped until then).
# First run also creates the app and puts one server in each region.
name: Deploy to Fly.io
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Create the app (first time only)
        if: env.FLY_API_TOKEN != ''
        run: flyctl status >/dev/null 2>&1 || flyctl apps create "$(grep -m1 '^app' fly.toml | cut -d'"' -f2)"
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only --ha=false
      - name: One server per region
        if: env.FLY_API_TOKEN != ''
        run: flyctl scale count 1 --region iad,gru,fra,nrt,sin,syd,jnb --yes
